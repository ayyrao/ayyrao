# xAgent 配置示例
# 复制为 config.ini 后使用；首次启动也会自动生成一份带注释的模板。

[llm]
# 推荐用环境变量 XAGENT_API_KEY 提供，避免把密钥写进文件
api_key = your_api_key_here
base_url = https://api.deepseek.com/v1
model_name = deepseek-flash
stream = true
temperature = 0.0
# 单次回复最大 token 数；留空或 0 表示交给服务端默认值
max_tokens = 4096

[agent]
max_tool_rounds = 10
request_interval = 0.8
context_window = 128000
# 上下文占用达到 60% 后暂停普通输入
compact_threshold = 0.6
agents_md = true

[paths]
workspace = workspace
skills_dir = .agents/skills
session_dir = .agents/sessions
context_archive_dir = .agents/context
mcp_config = .mcp.json

[session]
auto_save = true
title_max_chars = 30

[tui]
sidebar_width = 34
theme = textual-dark
show_status_bar = true

[security]
sandbox_root = workspace
max_tool_calls = 20

[search]
# 百度千帆 AI 搜索 API Key（禁止写进源码，只放在本文件或本地 config.ini）
baidu_qianfan_api_key = your-baidu-qianfan-api-key
# 千帆 AI 搜索接口地址
endpoint = https://qianfan.baidubce.com/v2/ai_search/web_search
# 单次搜索超时（秒）
timeout = 15
# 默认返回条数（1-20）
top_k = 10
